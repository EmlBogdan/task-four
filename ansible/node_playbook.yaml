- name: task-three-playbook
  hosts: webservers
  tasks: 
  - name: Copy file with owner and permissions
    ansible.builtin.copy:
    src: .../index.html
    dest: /var/index.html
    owner: ec2-user
    group: ec2-user
    mode: '0644'

  - name: Print message
    ansible.builtin.debug:
      msg: Hello world