[vm3]
vm3 ansible_host=10.0.1.12 ansible_user=ec2-user

[vm3:vars]
ansible_ssh_common_args='-o ProxyCommand="ssh -W %h:%p ubuntu@100.59.34.141 -i /home/ubuntu/.ssh/id_rsa -o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null"'
ansible_ssh_private_key_file=/home/ubuntu/.ssh/id_rsa
ansible_ssh_extra_args='-o StrictHostKeyChecking=no -o UserKnownHostsFile=/dev/null'